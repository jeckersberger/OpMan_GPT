# ═══════════════════════════════════════════════════════════════
# Docker Compose – ÜBUNGSMODUS
# ═══════════════════════════════════════════════════════════════
# Eigenständige Anwendung für den Übungsbetrieb:
# - Kein Login erforderlich (Auto-Login)
# - Patientenkarten und Übungsfälle verfügbar
# - Eigene Datenbank (einsatzleiter.db)
# - Komplett getrennt vom Einsatzmodus
#
# Starten:  docker compose up -d
# Stoppen:  docker compose down
#
# Für den Einsatzmodus: docker compose -f docker-compose.einsatz.yml up -d
# ═══════════════════════════════════════════════════════════════

services:
  opman-uebung:
    build: .
    image: opman-gpt:latest
    container_name: opman-uebung
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-5000}:8000"

    environment:
      APP_MODE: "uebung"
      SECRET_KEY: "${SECRET_KEY:-uebung-dev-key}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      ENABLE_METRICS: "${ENABLE_METRICS:-true}"

    volumes:
      - uebung-data:/app/instance:Z

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uebung-data:
