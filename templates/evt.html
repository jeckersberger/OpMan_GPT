<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0b1220"/>
  <title>EVT Mobile – BRK Feucht</title>
  <style>
    :root {
      --bg:     #0b1220;
      --panel:  #111b2e;
      --panel2: #162035;
      --text:   #e7eefc;
      --accent: #4ea1ff;
      --green:  #3ddc84;
      --yellow: #f5c842;
      --red:    #ff4f4f;
      --orange: #ff9f43;
      --muted:  #a6b3d1;
      --border: #223152;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem .9rem;
      background: var(--panel);
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header a.back {
      color: var(--accent);
      text-decoration: none;
      font-size: .8rem;
      padding: .3rem .6rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      white-space: nowrap;
    }
    .header h1 { font-size: .95rem; font-weight: 700; flex: 1; }
    .header .clock { font-size: .82rem; color: var(--muted); white-space: nowrap; }
    .pulse-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── Content ── */
    .content { padding: .75rem; display: flex; flex-direction: column; gap: .75rem; }

    /* ── EVT Selector ── */
    .evt-selector {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .7rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .evt-selector label { font-weight: 700; font-size: .9rem; white-space: nowrap; }
    .evt-selector select {
      flex: 1;
      padding: .55rem .75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      font-weight: 700;
    }

    /* ── Team Status ── */
    .team-status {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: .7rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .team-status.c-1,.team-status.c-2 { border-color: var(--green); }
    .team-status.c-3 { border-color: var(--yellow); }
    .team-status.c-4 { border-color: var(--accent); }
    .team-status.c-7,.team-status.c-8 { border-color: var(--orange); }
    .team-status.c-0,.team-status.c-5 { border-color: var(--red); }

    .team-name { font-weight: 800; font-size: 1.1rem; flex: 1; }
    .fms-badge {
      padding: .3rem .7rem;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 700;
      background: var(--panel2);
      color: var(--muted);
    }
    .c-1 .fms-badge,.c-2 .fms-badge { background: #1a3a20; color: var(--green); }
    .c-3 .fms-badge  { background: #2e2300; color: var(--yellow); }
    .c-4 .fms-badge  { background: #1a2a3a; color: var(--accent); }
    .c-7 .fms-badge,.c-8 .fms-badge { background: #2e1a00; color: var(--orange); }
    .c-0 .fms-badge,.c-5 .fms-badge { background: #3a1a1a; color: var(--red); }

    /* ── Case Card ── */
    .case-card {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .case-card.active { border-color: var(--accent); }
    .case-card.done   { border-color: var(--green);  opacity: .8; }

    .case-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem 1rem;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
    }
    .case-pid {
      font-weight: 900;
      font-size: 1.1rem;
      background: var(--accent);
      color: #fff;
      padding: .1rem .55rem;
      border-radius: 6px;
    }
    .case-pid.done { background: var(--green); color: #000; }
    .case-schlagwort { font-size: .9rem; font-weight: 700; flex: 1; }
    .done-badge { color: var(--green); font-size: .8rem; font-weight: 700; white-space: nowrap; }

    .case-body { padding: .75rem 1rem; display: flex; flex-direction: column; gap: .65rem; }
    .case-patient { font-size: 1.05rem; font-weight: 700; }
    .case-age     { font-size: .85rem; color: var(--muted); }

    .w3w-block { display: flex; flex-direction: column; gap: .25rem; }
    .w3w-link {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .95rem;
    }
    .w3w-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-family: monospace;
      letter-spacing: -.01em;
    }
    .w3w-link a:active { opacity: .7; }
    .w3w-alarm-note {
      font-size: .78rem;
      color: var(--yellow);
      background: rgba(245,200,66,.08);
      border: 1px solid rgba(245,200,66,.2);
      border-radius: 5px;
      padding: .25rem .55rem;
    }

    /* Timestamp row */
    .ts-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: .3rem;
      margin-top: .1rem;
    }
    .ts-chip {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .3rem .15rem;
      text-align: center;
    }
    .ts-chip .tl { font-size: .62rem; color: var(--muted); display: block; }
    .ts-chip .tv { font-size: .7rem;  font-weight: 700;   display: block; }
    .ts-chip .tv.empty { color: var(--border); }

    /* No case */
    .no-case {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
    }
    .no-case .icon { font-size: 2.2rem; margin-bottom: .5rem; }

    /* ── FMS Buttons ── */
    .fms-section { display: flex; flex-direction: column; gap: .5rem; }
    .fms-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    .fms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .5rem;
    }
    .fms-btn {
      padding: 1.1rem .4rem .9rem;
      border: 2px solid;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      transition: opacity .12s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      background: transparent;
    }
    .fms-btn:active { opacity: .75; transform: scale(.96); }
    .fms-btn.is-active { box-shadow: 0 0 0 3px rgba(255,255,255,.55); }
    .fms-btn:disabled { opacity: .3; cursor: not-allowed; }
    .fms-btn .fs-code { font-size: 1.25rem; display: block; }
    .fms-btn .fs-sub  { font-size: .72rem;  display: block; font-weight: 600; }

    .fms-btn.b-s1 { border-color: var(--green);  color: var(--green);  background: #0e2a18; }
    .fms-btn.b-s2 { border-color: #4ec97e;       color: #4ec97e;       background: #0b2216; }
    .fms-btn.b-s3 { border-color: var(--yellow); color: var(--yellow); background: #2e2300; }
    .fms-btn.b-s4 { border-color: var(--accent); color: var(--accent); background: #0d2240; }
    .fms-btn.b-s5 { border-color: var(--muted);  color: var(--muted);  background: #1a2030; }
    .fms-btn.b-s6 { border-color: #6b7280;       color: #9ca3af;       background: #1a1a20; }
    .fms-btn.b-s7 { border-color: var(--orange); color: var(--orange); background: #2e1a00; }
    .fms-btn.b-s8 { border-color: #5de89a;       color: #5de89a;       background: #0a2215; }
    .fms-btn.b-s9 { border-color: #c084fc;       color: #c084fc;       background: #1a0a2e; }

    /* S0 Notfall-Button – volle Breite, auffällig rot */
    .fms-btn.b-s0 {
      border-color: var(--red); color: var(--red); background: #2e0a0a;
      grid-column: 1 / -1;
      font-size: 1rem;
      padding: .9rem .4rem;
    }
    .fms-btn.b-s0 .fs-code { font-size: 1.1rem; }
    .fms-btn.b-s0.is-active { box-shadow: 0 0 0 3px rgba(255,79,79,.7); }

    /* ── Warning box ── */
    .warn-box {
      background: rgba(255,79,79,.08);
      border: 1px solid rgba(255,79,79,.28);
      border-radius: 8px;
      padding: .6rem .85rem;
      font-size: .82rem;
      color: var(--red);
      line-height: 1.6;
    }

    /* ── Alarm Overlay ── */
    .alarm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.87);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.5rem;
    }
    .alarm-overlay.show { display: flex; }

    .alarm-box {
      background: #1a0800;
      border: 3px solid var(--orange);
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: alarmPulse .75s ease-in-out infinite alternate;
    }
    @keyframes alarmPulse {
      from { border-color: var(--orange); box-shadow: 0 0 18px rgba(255,159,67,.3); }
      to   { border-color: var(--red);    box-shadow: 0 0 40px rgba(255,79,79,.5); }
    }
    .alarm-icon      { font-size: 3rem; margin-bottom: .5rem; }
    .alarm-title     { font-size: 1.2rem; font-weight: 800; color: var(--orange); margin-bottom: .5rem; }
    .alarm-pid-big   { font-size: 3rem; font-weight: 900; color: #fff; line-height: 1; margin-bottom: .2rem; }
    .alarm-schlw     { font-size: 1rem; color: var(--text); margin-bottom: 1.25rem; font-weight: 600; }
    .alarm-dismiss {
      width: 100%;
      padding: 1rem;
      background: var(--orange);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .alarm-dismiss:active { opacity: .8; }
    .alarm-detail {
      font-size: .85rem;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.6;
    }
    .alarm-detail .alarm-w3w { color: var(--accent); font-family: monospace; font-weight: 700; }
    .alarm-detail .alarm-patient { font-weight: 700; }

    /* ── GPS Status ── */
    .gps-dot {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .72rem;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      padding: .2rem .4rem;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: border-color .2s;
    }
    .gps-dot:hover { border-color: var(--border); }
    .gps-dot .gps-circle {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .gps-dot.active   .gps-circle { background: var(--green); animation: blink 2s ease-in-out infinite; }
    .gps-dot.error    .gps-circle { background: var(--red); }
    .gps-dot.waiting  .gps-circle { background: var(--yellow); animation: blink 1s ease-in-out infinite; }
  </style>
</head>
<body>

<!-- ══ ALARM OVERLAY ══ -->
<div class="alarm-overlay" id="alarmOverlay">
  <div class="alarm-box">
    <div class="alarm-icon">🚨</div>
    <div class="alarm-title">NEUER EINSATZ!</div>
    <div class="alarm-pid-big" id="alarmPid">–</div>
    <div class="alarm-schlw" id="alarmSchlw">–</div>
    <div class="alarm-detail" id="alarmDetail"></div>
    <button class="alarm-dismiss" id="alarmDismiss">✓ Quittieren</button>
  </div>
</div>

<!-- ══ TESTALARM OVERLAY ══ -->
<div class="alarm-overlay" id="testAlarmOverlay" style="background:rgba(180,120,0,0.82);">
  <div class="alarm-box" style="border-color:#f5c842;box-shadow:0 0 40px rgba(245,200,66,0.5);">
    <div class="alarm-icon">🔔</div>
    <div class="alarm-title" style="color:#f5c842;">TESTALARM</div>
    <div class="alarm-pid-big" style="font-size:1.4rem;margin-bottom:.8rem;" id="testAlarmText">–</div>
    <div style="font-size:.8rem;color:#ccc;margin-bottom:1.2rem;">
      Dies ist kein echter Einsatz.<br>Quittiere zur Bestätigung.
    </div>
    <button class="alarm-dismiss" id="testAlarmDismiss" style="background:#f5c842;color:#000;">✓ Quittieren</button>
  </div>
</div>

<!-- ══ HEADER ══ -->
<div class="header">
  <a class="back" href="/">← EL</a>
  <h1>📱 EVT Mobile</h1>
  <span class="clock" id="clock"></span>
  <span class="gps-dot" id="gpsDot" title="Standort-Tracking ein/aus">
    <span class="gps-circle"></span>
    <span id="gpsLabel">GPS</span>
  </span>
  <span class="pulse-dot" id="pulseDot" title="Live-Verbindung"></span>
</div>

<!-- ══ CONTENT ══ -->
<div class="content">

  <!-- EVT Auswahl -->
  <div class="evt-selector">
    <label for="evtSelect">Ich bin:</label>
    <select id="evtSelect">
      <option value="">– EVT wählen –</option>
      {% for case_id in cases %}
      <option value="EVT {{ loop.index }}">EVT {{ loop.index }} ({{ case_id }})</option>
      {% endfor %}
    </select>
  </div>

  <!-- Dynamischer Bereich -->
  <div id="mainContent"></div>

</div>

<script>
// ── Daten aus Jinja ──────────────────────────────────────────
const CASES_META = {{ cases | tojson }};

const FMS_LABELS = {
  0: 'S0 Notruf',     1: 'S1 Frei Funk',   2: 'S2 Frei Wache',
  3: 'S3 Unterwegs',  4: 'S4 Einsatzort',  5: 'S5 Sprechwunsch',
  6: 'S6 n. einsatzber.', 7: 'S7 Transport', 8: 'S8 Ziel', 9: 'S9 Sonderfunktion'
};

// ── State ────────────────────────────────────────────────────
let selectedEvt   = '';
let currentTeamId = null;
let currentRs     = null;
let pollHandle    = null;
let seenAlarms    = new Set();  // in-memory; resets on page load → EVT sieht Alarm erneut

// ── HTML escaping ────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Uhrzeiten formatieren ─────────────────────────────────────
function fmtTime(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

// ── Uhr ──────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
tick();
setInterval(tick, 1000);

// ── EVT-Auswahl ───────────────────────────────────────────────
const evtSelect = document.getElementById('evtSelect');

// Gespeicherte Auswahl laden
const savedEvt = localStorage.getItem('evt_selected') || '';
if (savedEvt) evtSelect.value = savedEvt;

evtSelect.addEventListener('change', () => {
  _unlockAudio();  // Audio-Context beim ersten Tippen entsperren
  const v = evtSelect.value;
  localStorage.setItem('evt_selected', v);
  selectedEvt   = v;
  currentTeamId = null;
  currentRs     = null;
  stopGps();  // GPS stoppen bis Team-ID aus Poll bekannt
  if (pollHandle) clearInterval(pollHandle);
  if (v) {
    poll();
    pollHandle = setInterval(poll, 5000);
  } else {
    document.getElementById('mainContent').innerHTML = '';
  }
});

if (savedEvt) {
  selectedEvt = savedEvt;
  poll();
  pollHandle = setInterval(poll, 5000);
}

// ── Polling ──────────────────────────────────────────────────
async function poll() {
  if (!selectedEvt) return;
  try {
    const res = await fetch(`/api/evt-status/${encodeURIComponent(selectedEvt)}`);
    if (!res.ok) { setDot(false); return; }
    const data = await res.json();
    setDot(true);

    if (data.team) {
      currentTeamId = data.team.id;
      currentRs     = data.team.radio_status;
      maybeStartGps();
    }

    // Echter Alarm erkennen
    const doc = data.case;
    if (doc && doc.alarm_time && !doc.completed) {
      const key = `${doc.id}:${doc.alarm_time}`;
      if (!seenAlarms.has(key)) {
        triggerAlarm(doc, data.case_meta);
      }
    }

    // Testalarm erkennen
    if (data.team && data.team.test_alarm_at) {
      showTestAlarm(data.team);
    }

    renderMain(data.team, data.case, data.case_meta);
  } catch (e) {
    setDot(false);
  }
}

function setDot(ok) {
  const d = document.getElementById('pulseDot');
  if (d) d.style.background = ok ? 'var(--green)' : 'var(--red)';
}

// ── Alarmton (Web Audio API) ──────────────────────────────────
// Ein persistenter AudioContext, der bei erster Nutzerinteraktion entsperrt wird
let _audioCtx = null;

function _unlockAudio() {
  if (_audioCtx) return;
  try {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Stille Note → entsperrt den Context auch auf iOS/Android
    const osc = _audioCtx.createOscillator();
    osc.connect(_audioCtx.destination);
    osc.start();
    osc.stop(_audioCtx.currentTime + 0.001);
  } catch (e) { _audioCtx = null; }
}

function _playAlarmTone() {
  if (!_audioCtx) return;
  try {
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    const seq = [
      { freq: 880, start: 0.0, dur: 0.18 },
      { freq: 660, start: 0.2, dur: 0.18 },
      { freq: 880, start: 0.4, dur: 0.18 },
      { freq: 660, start: 0.6, dur: 0.18 },
      { freq: 880, start: 0.8, dur: 0.25 },
    ];
    seq.forEach(({ freq, start, dur }) => {
      const osc  = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.35, _audioCtx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + start + dur);
      osc.start(_audioCtx.currentTime + start);
      osc.stop(_audioCtx.currentTime + start + dur + 0.02);
    });
  } catch (e) { /* kein Audio-Support */ }
}

// ── Alarm ────────────────────────────────────────────────────
let _alarmDoc = null;

function triggerAlarm(doc, meta) {
  const key = `${doc.id}:${doc.alarm_time}`;
  seenAlarms.add(key);  // schon jetzt als gesehen markieren, verhindert Doppelt-Anzeige

  _playAlarmTone();
  if (navigator.vibrate) navigator.vibrate([400, 120, 400, 120, 800]);

  _alarmDoc = doc;
  document.getElementById('alarmPid').textContent  = doc.id || '–';
  document.getElementById('alarmSchlw').textContent = (meta && meta.schlagwort) ? meta.schlagwort : '–';

  // Alarmdetails: ggf. falscher Name (P2) oder falsche Adresse (P3)
  let detail = '';
  if (meta) {
    const patName  = meta.patient_alarm || meta.patient || '';
    const w3wAlarm = meta.w3w_alarm || meta.w3w || '';
    if (patName)  detail += `<div>Patient: <span class="alarm-patient">${esc(patName)}</span></div>`;
    if (w3wAlarm) detail += `<div>Ort: <span class="alarm-w3w">${esc(w3wAlarm)}</span></div>`;
  }
  document.getElementById('alarmDetail').innerHTML = detail;

  document.getElementById('alarmOverlay').classList.add('show');
}

document.getElementById('alarmDismiss').addEventListener('click', async () => {
  document.getElementById('alarmOverlay').classList.remove('show');
  _alarmDoc = null;
  // Alarm quittieren = S3 (Einsatz übernommen) senden
  await setFms(3);
});

// ── Testalarm ────────────────────────────────────────────────
let _testAlarmShown = null;  // timestamp-string des aktuellen Testalarms

function showTestAlarm(team) {
  const key = team.test_alarm_at;
  if (_testAlarmShown === key) return;  // bereits angezeigt
  _testAlarmShown = key;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[440,0,.1],[550,.15,.1],[660,.3,.1],[550,.45,.1],[440,.6,.15]].forEach(([f,s,d])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.3, ctx.currentTime+s);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+s+d);
      o.start(ctx.currentTime+s); o.stop(ctx.currentTime+s+d+.05);
    });
  } catch(_) {}
  document.getElementById('testAlarmText').textContent = team.test_alarm_text || 'Testalarm';
  document.getElementById('testAlarmOverlay').classList.add('show');
}

document.getElementById('testAlarmDismiss').addEventListener('click', async () => {
  document.getElementById('testAlarmOverlay').classList.remove('show');
  if (currentTeamId) {
    // Testalarm löschen + S3 setzen (Einsatz übernommen)
    await Promise.all([
      fetch(`/api/testalarm/${currentTeamId}`, { method: 'DELETE' }),
      setFms(3),
    ]);
  }
  _testAlarmShown = null;
});

// ── Render ───────────────────────────────────────────────────
function renderMain(team, doc, meta) {
  if (!selectedEvt) { document.getElementById('mainContent').innerHTML = ''; return; }

  const rs      = team ? team.radio_status : null;
  const rsCls   = rs !== null ? `c-${[0,5].includes(rs) ? 0 : rs}` : '';
  const pending = !!(team && team.pending_alarm);
  const rsLabel = rs !== null ? (FMS_LABELS[rs] || 'S' + rs) + (pending ? ' ·P' : '') : '–';
  const notFound = !team;

  // Team-Status-Block
  let teamHtml = '';
  if (notFound) {
    teamHtml = `<div class="warn-box">
      ⚠ Team <strong>${esc(selectedEvt)}</strong> nicht in der DB gefunden.<br>
      Im Einsatzleiter anlegen → dann FMS-Tasten aktiviert.
    </div>`;
  } else {
    const badgeStyle = pending
      ? ' style="background:#3a2800;color:#f5c842;border:1px solid #f5c842;"'
      : '';
    const rg = team.radio_group || 'regelfunk';
    const rgLabel = rg === 'bettenkanal'
      ? `<span style="font-size:.7rem;color:#c084fc;font-weight:700;margin-top:.25rem;display:block;">🏥 Bettenkanal</span>`
      : `<span style="font-size:.7rem;color:#4ea1ff;font-weight:700;margin-top:.25rem;display:block;">📻 Regelfunk</span>`;
    teamHtml = `<div class="team-status ${rsCls}${pending ? ' c-0' : ''}">
      <div class="team-name">${esc(team.name)}</div>
      <div class="fms-badge"${badgeStyle}>${esc(rsLabel)}</div>
      ${rgLabel}
      <span class="pulse-dot"></span>
    </div>`;
  }

  // Fall-Karte
  let caseHtml = '';
  if (doc) {
    const done  = !!doc.completed;
    const m     = meta || {};
    const w3wRaw = m.w3w_alarm || m.w3w || '';
    const w3wClean = w3wRaw.replace('///', '');

    const ts = [
      { l: 'Alarm', v: doc.alarm_time   },
      { l: 'S3',    v: doc.status3_time },
      { l: 'S4',    v: doc.status4_time },
      { l: 'S7',    v: doc.status7_time },
      { l: 'S8',    v: doc.status8_time },
    ].map(({l,v}) => {
      const t = v ? fmtTime(v) : '–';
      return `<div class="ts-chip">
        <span class="tl">${l}</span>
        <span class="tv${v?'':' empty'}">${t}</span>
      </div>`;
    }).join('');

    let ageGender = '';
    if (m.alter)    ageGender += m.alter + ' J.';
    if (m.geschlecht === 'm') ageGender += ' (m)';
    if (m.geschlecht === 'w') ageGender += ' (w)';

    caseHtml = `<div class="case-card ${done ? 'done' : 'active'}">
      <div class="case-header">
        <span class="case-pid${done?' done':''}">${esc(doc.id)}</span>
        <span class="case-schlagwort">${esc(m.schlagwort || '–')}</span>
        ${done ? '<span class="done-badge">✓ Abgeschlossen</span>' : ''}
      </div>
      <div class="case-body">
        <div>
          <div class="case-patient">${esc(m.patient_alarm || m.patient || '–')}</div>
          ${ageGender ? `<div class="case-age">${esc(ageGender)}</div>` : ''}
        </div>
        ${w3wClean ? `<div class="w3w-block">
          <div class="w3w-link">📍
            <a href="https://what3words.com/${esc(w3wClean)}" target="_blank">${esc(w3wRaw)}</a>
          </div>
        </div>` : ''}
        <div class="ts-row">${ts}</div>
      </div>
    </div>`;
  } else {
    caseHtml = `<div class="case-card">
      <div class="no-case">
        <div class="icon">📡</div>
        Kein aktiver Einsatz.<br>Warte auf Alarmierung…
      </div>
    </div>`;
  }

  // FMS-Tasten (Ziffernblock-Reihenfolge: 1-2-3 / 4-5-6 / 7-8-9 / 0)
  const btnDefs = [
    { rs: 1, cls: 'b-s1', code: 'S1', sub: 'Frei Funk'    },
    { rs: 2, cls: 'b-s2', code: 'S2', sub: 'Frei Wache'   },
    { rs: 3, cls: 'b-s3', code: 'S3', sub: 'Anfahrt'      },
    { rs: 4, cls: 'b-s4', code: 'S4', sub: 'Einsatzort'   },
    { rs: 5, cls: 'b-s5', code: 'S5', sub: 'Sprechwunsch' },
    { rs: 6, cls: 'b-s6', code: 'S6', sub: 'n. einsatzber.'},
    { rs: 7, cls: 'b-s7', code: 'S7', sub: 'Transport'    },
    { rs: 8, cls: 'b-s8', code: 'S8', sub: 'Ziel'         },
    { rs: 9, cls: 'b-s9', code: 'S9', sub: 'Sonderfunkt.' },
    { rs: 0, cls: 'b-s0', code: '🚨 S0', sub: 'Dringend Sprechwunsch' },
  ];
  const fmsBtns = btnDefs.map(b => {
    const active  = currentRs === b.rs ? ' is-active' : '';
    const dis     = notFound ? ' disabled' : '';
    return `<button class="fms-btn ${b.cls}${active}" onclick="setFms(${b.rs})"${dis}>
      <span class="fs-code">${b.code}</span>
      <span class="fs-sub">${b.sub}</span>
    </button>`;
  }).join('');

  // Funkgruppen-Toggle
  const rg = team ? (team.radio_group || 'regelfunk') : 'regelfunk';
  const rgDis = notFound ? ' disabled' : '';
  const groupToggle = `
    <div style="display:flex;gap:.5rem;margin-bottom:.4rem;">
      <button onclick="setRadioGroup('regelfunk')"${rgDis}
        style="flex:1;padding:.55rem .3rem;border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;
          border:2px solid ${rg==='regelfunk'?'#4ea1ff':'#334'};
          background:${rg==='regelfunk'?'#0d2240':'transparent'};
          color:${rg==='regelfunk'?'#4ea1ff':'#a6b3d1'};">
        📻 Regelfunk
      </button>
      <button onclick="setRadioGroup('bettenkanal')"${rgDis}
        style="flex:1;padding:.55rem .3rem;border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;
          border:2px solid ${rg==='bettenkanal'?'#c084fc':'#334'};
          background:${rg==='bettenkanal'?'#1a0a2e':'transparent'};
          color:${rg==='bettenkanal'?'#c084fc':'#a6b3d1'};">
        🏥 Bettenkanal
      </button>
    </div>`;

  document.getElementById('mainContent').innerHTML = `
    ${teamHtml}
    ${caseHtml}
    <div class="fms-section">
      <div class="fms-label">Funkgruppe &amp; Status</div>
      ${groupToggle}
      <div class="fms-grid">${fmsBtns}</div>
    </div>
  `;
}

// ── FMS setzen ───────────────────────────────────────────────
async function setFms(rs) {
  if (!currentTeamId) {
    alert(`Team "${selectedEvt}" nicht in DB. Bitte im Einsatzleiter anlegen.`);
    return;
  }
  try {
    const res = await fetch(`/api/teams/${currentTeamId}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ radio_status: rs }),
    });
    if (res.ok) {
      const t = await res.json();
      currentRs = t.radio_status;
      await poll();
    }
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

// ── Funkgruppe setzen ─────────────────────────────────────────
async function setRadioGroup(group) {
  if (!currentTeamId) return;
  try {
    const res = await fetch(`/api/teams/${currentTeamId}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ radio_group: group }),
    });
    if (res.ok) await poll();
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

// ── GPS-Standort-Tracking ─────────────────────────────────────
let _gpsWatchId   = null;
let _gpsFallback  = null;   // Fallback-Intervall für iOS
let _gpsEnabled   = (localStorage.getItem('evt_gps') !== '0');  // default: ein
let _lastGpsLat   = null;
let _lastGpsLng   = null;
let _lastGpsSent  = 0;
let _gpsGotFix    = false;  // true sobald erster Fix kam

const GPS_SEND_INTERVAL = 10000;  // mindestens alle 10 s senden
const GPS_MIN_METERS    = 5;      // nur senden wenn >5 m Bewegung ODER Interval abgelaufen

function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function _setGpsDot(state, label) {
  const dot = document.getElementById('gpsDot');
  const lbl = document.getElementById('gpsLabel');
  if (!dot) return;
  dot.className = 'gps-dot ' + (state || '');
  if (lbl) lbl.textContent = label || 'GPS';
}

async function _sendGps(lat, lng) {
  if (!currentTeamId) return;
  try {
    await fetch(`/api/teams/${currentTeamId}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ lat, lng, gps: true }),
    });
    _lastGpsLat  = lat;
    _lastGpsLng  = lng;
    _lastGpsSent = Date.now();
  } catch (_) { /* silent */ }
}

function _onGpsPosition(pos) {
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  const acc = Math.round(accuracy);
  _gpsGotFix = true;
  _setGpsDot('active', `±${acc}m`);

  const moved = (_lastGpsLat == null)
    ? 999
    : haversineM(_lastGpsLat, _lastGpsLng, lat, lng);
  const timeDue = (Date.now() - _lastGpsSent) >= GPS_SEND_INTERVAL;

  if (moved >= GPS_MIN_METERS || timeDue) {
    _sendGps(lat, lng);
  }
}

function _onGpsError(err) {
  const msgs = { 1: 'keine Berechtigung', 2: 'kein Signal', 3: 'Timeout' };
  _setGpsDot('error', msgs[err.code] || 'GPS-Fehler');
}

// iOS Safari: watchPosition feuert oft nicht zuverlässig.
// Workaround: erst getCurrentPosition aufrufen (triggert Permission-Dialog),
// dann watchPosition + Fallback-Polling alle 15s mit getCurrentPosition.
function startGps() {
  if (!navigator.geolocation) {
    _setGpsDot('error', 'nicht unterstützt');
    return;
  }
  // HTTPS-Check (Geolocation braucht Secure Context)
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    _setGpsDot('error', 'HTTPS nötig');
    return;
  }
  _setGpsDot('waiting', 'Suche…');
  _gpsGotFix = false;

  const opts = { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 };

  // 1) getCurrentPosition – triggert iOS-Permission-Dialog zuverlässig
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      _onGpsPosition(pos);
      _startWatch(opts);
    },
    (err) => {
      _onGpsError(err);
      _startWatch(opts);  // trotzdem versuchen
    },
    opts
  );
}

function _startWatch(opts) {
  // 2) watchPosition für kontinuierliche Updates
  if (_gpsWatchId == null) {
    _gpsWatchId = navigator.geolocation.watchPosition(
      _onGpsPosition,
      _onGpsError,
      opts
    );
  }

  // 3) Fallback-Polling für iOS: alle 15s getCurrentPosition
  //    (fängt Fälle ab wo watchPosition aufhört zu feuern)
  if (!_gpsFallback) {
    _gpsFallback = setInterval(() => {
      if (!_gpsEnabled || !currentTeamId) return;
      navigator.geolocation.getCurrentPosition(
        _onGpsPosition,
        () => {},  // stille Fehler im Fallback
        { enableHighAccuracy: true, maximumAge: 20000, timeout: 15000 }
      );
    }, 15000);
  }
}

function stopGps() {
  if (_gpsWatchId != null) {
    navigator.geolocation.clearWatch(_gpsWatchId);
    _gpsWatchId = null;
  }
  if (_gpsFallback) {
    clearInterval(_gpsFallback);
    _gpsFallback = null;
  }
  _gpsGotFix = false;
  _setGpsDot('', 'GPS aus');
}

// Initialer GPS-Dot-Status beim Laden
_setGpsDot(_gpsEnabled ? 'waiting' : '', _gpsEnabled ? 'GPS' : 'GPS aus');

// Toggle per Klick auf GPS-Dot
document.getElementById('gpsDot').addEventListener('click', () => {
  _gpsEnabled = !_gpsEnabled;
  localStorage.setItem('evt_gps', _gpsEnabled ? '1' : '0');
  if (_gpsEnabled && currentTeamId) {
    startGps();
  } else {
    stopGps();
  }
});

// GPS automatisch starten wenn EVT ausgewählt und Tracking aktiviert
function maybeStartGps() {
  if (_gpsEnabled && currentTeamId) {
    if (_gpsWatchId == null) startGps();
  }
}
</script>
