# =============================================================================
# OpMan-GPT nginx Reverse Proxy Configuration
# =============================================================================
# High-availability reverse proxy with:
#   - Load balancing across multiple gunicorn workers/instances
#   - TLS 1.3 with BSI TR-02102-2 recommended cipher suites
#   - Rate limiting at proxy level (defense-in-depth)
#   - Security headers (redundant with Flask app headers)
#   - WebSocket support for future real-time features
#   - Health check endpoint monitoring
#
# Usage:
#   Place SSL certificates at:
#     /etc/nginx/ssl/opman.crt
#     /etc/nginx/ssl/opman.key
#     /etc/nginx/ssl/dhparam.pem  (generate: openssl dhparam -out dhparam.pem 4096)
#
#   Test config:  nginx -t
#   Reload:       nginx -s reload
# =============================================================================

# ── Worker configuration ─────────────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Hide nginx version
    server_tokens off;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Rate Limiting (defense-in-depth, app also has Flask-Limiter) ──────────
    # General request rate limit
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    # Stricter limit for authentication endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # API endpoint limit
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    limit_req_status 429;
    limit_req_log_level warn;

    # ── Upstream: OpMan-GPT application instances ────────────────────────────
    upstream opman_app {
        # Least-connections load balancing for even distribution
        least_conn;

        # Application instances (adjust for your deployment)
        server opman-app-1:8000 max_fails=3 fail_timeout=30s;
        server opman-app-2:8000 max_fails=3 fail_timeout=30s;

        # Keep-alive connections to upstream
        keepalive 32;
    }

    # ── Redirect HTTP -> HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Allow health checks on HTTP (for load balancer probes)
        location /health {
            proxy_pass http://opman_app;
            proxy_set_header Host $host;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS Server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ── TLS 1.3 Configuration (BSI TR-02102-2 compliant) ─────────────────
        ssl_certificate     /etc/nginx/ssl/opman.crt;
        ssl_certificate_key /etc/nginx/ssl/opman.key;
        ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

        # TLS 1.3 only (BSI recommendation)
        ssl_protocols TLSv1.3;

        # BSI-recommended cipher suites for TLS 1.3
        # TLS 1.3 ciphers are configured via ssl_conf_command
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

        ssl_prefer_server_ciphers off;  # Not needed for TLS 1.3

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # SSL session settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;  # BSI recommends disabling session tickets

        # ── Security Headers (defense-in-depth, app also sets these) ─────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ── Health Check Endpoint (public, no rate limit) ────────────────────
        location /health {
            proxy_pass http://opman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No rate limiting on health checks
            access_log off;
        }

        # ── Metrics Endpoint (restrict to internal networks) ──────────────────
        location /metrics {
            # Allow only internal/monitoring networks
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://opman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            access_log off;
        }

        # ── Authentication Endpoints (strict rate limit) ─────────────────────
        location /login {
            limit_req zone=auth burst=3 nodelay;

            proxy_pass http://opman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API Endpoints ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://opman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket Support (for future real-time features) ────────────────
        location /ws/ {
            proxy_pass http://opman_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Static Files (served directly by nginx for performance) ──────────
        location /static/ {
            alias /app/static/;
            expires 1h;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ── Default: Proxy to Application ────────────────────────────────────
        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://opman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }
}
