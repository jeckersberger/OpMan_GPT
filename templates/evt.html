<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0b1220"/>
  <link rel="manifest" href="/static/manifest.json"/>
  <title>EVT Mobile – BRK Feucht</title>
  <style>
    :root {
      --bg:     #0b1220;
      --panel:  #111b2e;
      --panel2: #162035;
      --text:   #e7eefc;
      --accent: #4ea1ff;
      --green:  #3ddc84;
      --yellow: #f5c842;
      --red:    #ff4f4f;
      --orange: #ff9f43;
      --muted:  #a6b3d1;
      --border: #223152;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem .9rem;
      background: var(--panel);
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header a.back {
      color: var(--accent);
      text-decoration: none;
      font-size: .8rem;
      padding: .3rem .6rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      white-space: nowrap;
    }
    .header h1 { font-size: .95rem; font-weight: 700; flex: 1; }
    .header .clock { font-size: .82rem; color: var(--muted); white-space: nowrap; }
    .pulse-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── Content ── */
    .content { padding: .75rem; display: flex; flex-direction: column; gap: .75rem; }

    /* ── EVT Selector ── */
    .evt-selector {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .7rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .evt-selector label { font-weight: 700; font-size: .9rem; white-space: nowrap; }
    .evt-selector select {
      flex: 1;
      padding: .55rem .75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      font-weight: 700;
    }

    /* ── Team Status ── */
    .team-status {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: .7rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .team-status.c-1,.team-status.c-2 { border-color: var(--green); }
    .team-status.c-3 { border-color: var(--yellow); }
    .team-status.c-4 { border-color: var(--accent); }
    .team-status.c-7,.team-status.c-8 { border-color: var(--orange); }
    .team-status.c-0,.team-status.c-5 { border-color: var(--red); }

    .team-name { font-weight: 800; font-size: 1.1rem; flex: 1; }
    .fms-badge {
      padding: .3rem .7rem;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 700;
      background: var(--panel2);
      color: var(--muted);
    }
    .c-1 .fms-badge,.c-2 .fms-badge { background: #1a3a20; color: var(--green); }
    .c-3 .fms-badge  { background: #2e2300; color: var(--yellow); }
    .c-4 .fms-badge  { background: #1a2a3a; color: var(--accent); }
    .c-7 .fms-badge,.c-8 .fms-badge { background: #2e1a00; color: var(--orange); }
    .c-0 .fms-badge,.c-5 .fms-badge { background: #3a1a1a; color: var(--red); }

    /* ── Case Card ── */
    .case-card {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .case-card.active { border-color: var(--accent); }
    .case-card.done   { border-color: var(--green);  opacity: .8; }

    .case-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem 1rem;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
    }
    .case-pid {
      font-weight: 900;
      font-size: 1.1rem;
      background: var(--accent);
      color: #fff;
      padding: .1rem .55rem;
      border-radius: 6px;
    }
    .case-pid.done { background: var(--green); color: #000; }
    .case-schlagwort { font-size: .9rem; font-weight: 700; flex: 1; }
    .done-badge { color: var(--green); font-size: .8rem; font-weight: 700; white-space: nowrap; }

    .case-body { padding: .75rem 1rem; display: flex; flex-direction: column; gap: .65rem; }
    .case-patient { font-size: 1.05rem; font-weight: 700; }
    .case-age     { font-size: .85rem; color: var(--muted); }

    .w3w-block { display: flex; flex-direction: column; gap: .25rem; }
    .w3w-link {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .95rem;
    }
    .w3w-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-family: monospace;
      letter-spacing: -.01em;
    }
    .w3w-link a:active { opacity: .7; }
    .w3w-alarm-note {
      font-size: .78rem;
      color: var(--yellow);
      background: rgba(245,200,66,.08);
      border: 1px solid rgba(245,200,66,.2);
      border-radius: 5px;
      padding: .25rem .55rem;
    }

    /* Timestamp row */
    .ts-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: .3rem;
      margin-top: .1rem;
    }
    .ts-chip {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .3rem .15rem;
      text-align: center;
    }
    .ts-chip .tl { font-size: .62rem; color: var(--muted); display: block; }
    .ts-chip .tv { font-size: .7rem;  font-weight: 700;   display: block; }
    .ts-chip .tv.empty { color: var(--border); }

    /* No case */
    .no-case {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
    }
    .no-case .icon { font-size: 2.2rem; margin-bottom: .5rem; }

    /* ── FMS Buttons ── */
    .fms-section { display: flex; flex-direction: column; gap: .5rem; }
    .fms-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    .fms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .5rem;
    }
    .fms-btn {
      padding: 1.1rem .4rem .9rem;
      border: 2px solid;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      transition: opacity .12s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      background: transparent;
    }
    .fms-btn:active { opacity: .75; transform: scale(.96); }
    .fms-btn.is-active { box-shadow: 0 0 0 3px rgba(255,255,255,.55); }
    .fms-btn:disabled { opacity: .3; cursor: not-allowed; }
    .fms-btn .fs-code { font-size: 1.25rem; display: block; }
    .fms-btn .fs-sub  { font-size: .72rem;  display: block; font-weight: 600; }

    .fms-btn.b-s1 { border-color: #22cc66; color: #22cc66; background: #0e2a18; }
    .fms-btn.b-s2 { border-color: #0d7a3a; color: #0d7a3a; background: #0b2216; }
    .fms-btn.b-s3 { border-color: #f5c842; color: #f5c842; background: #2e2300; }
    .fms-btn.b-s4 { border-color: #2299ff; color: #2299ff; background: #0d2240; }
    .fms-btn.b-s5 { border-color: #888888; color: #888888; background: #1a2030; }
    .fms-btn.b-s6 { border-color: #888888; color: #888888; background: #1a1a20; }
    .fms-btn.b-s7 { border-color: #ff8800; color: #ff8800; background: #2e1a00; }
    .fms-btn.b-s8 { border-color: #9b59b6; color: #9b59b6; background: #1a0a2e; }
    .fms-btn.b-s9 { border-color: #888888; color: #888888; background: #1a1a20; }

    /* S0 Notfall-Button – volle Breite, auffällig rot */
    .fms-btn.b-s0 {
      border-color: var(--red); color: var(--red); background: #2e0a0a;
      grid-column: 1 / -1;
      font-size: 1rem;
      padding: .9rem .4rem;
    }
    .fms-btn.b-s0 .fs-code { font-size: 1.1rem; }
    .fms-btn.b-s0.is-active { box-shadow: 0 0 0 3px rgba(255,79,79,.7); }

    /* ── Warning box ── */
    .warn-box {
      background: rgba(255,79,79,.08);
      border: 1px solid rgba(255,79,79,.28);
      border-radius: 8px;
      padding: .6rem .85rem;
      font-size: .82rem;
      color: var(--red);
      line-height: 1.6;
    }

    /* ── Alarm Overlay ── */
    .alarm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.87);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.5rem;
    }
    .alarm-overlay.show { display: flex; }

    .alarm-box {
      background: #1a0800;
      border: 3px solid var(--orange);
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: alarmPulse .75s ease-in-out infinite alternate;
    }
    @keyframes alarmPulse {
      from { border-color: var(--orange); box-shadow: 0 0 18px rgba(255,159,67,.3); }
      to   { border-color: var(--red);    box-shadow: 0 0 40px rgba(255,79,79,.5); }
    }
    .alarm-icon      { font-size: 3rem; margin-bottom: .5rem; }
    .alarm-title     { font-size: 1.2rem; font-weight: 800; color: var(--orange); margin-bottom: .5rem; }
    .alarm-pid-big   { font-size: 3rem; font-weight: 900; color: #fff; line-height: 1; margin-bottom: .2rem; }
    .alarm-schlw     { font-size: 1rem; color: var(--text); margin-bottom: 1.25rem; font-weight: 600; }
    .alarm-dismiss {
      width: 100%;
      padding: 1rem;
      background: var(--orange);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .alarm-dismiss:active { opacity: .8; }
    .alarm-detail {
      font-size: .85rem;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.6;
    }
    /* Aktivierungs-Overlay: Nutzer muss tippen um Audio freizuschalten */
    .activate-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 998;
      padding: 1.5rem;
    }
    .activate-overlay.show { display: flex; }
    .activate-box {
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .activate-box .act-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .activate-box .act-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: .5rem; }
    .activate-box .act-desc { font-size: .85rem; color: var(--muted); margin-bottom: 1.25rem; line-height: 1.5; }
    .activate-btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .activate-btn:active { opacity: .8; }
    .alarm-detail .alarm-w3w { color: var(--accent); font-family: monospace; font-weight: 700; }
    .alarm-detail .alarm-patient { font-weight: 700; }

    /* ── GPS Status ── */
    .gps-dot {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .72rem;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      padding: .2rem .4rem;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: border-color .2s;
    }
    .gps-dot:hover { border-color: var(--border); }
    .gps-dot .gps-circle {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .gps-dot.active   .gps-circle { background: var(--green); animation: blink 2s ease-in-out infinite; }
    .gps-dot.error    .gps-circle { background: var(--red); }
    .gps-dot.waiting  .gps-circle { background: var(--yellow); animation: blink 1s ease-in-out infinite; }
    /* GPS Accuracy Farbfeedback */
    .gps-dot.acc-good  { color: var(--green); }
    .gps-dot.acc-fair  { color: var(--yellow); }
    .gps-dot.acc-poor  { color: #ff8800; }
  </style>
</head>
<body>

<!-- ══ ALARM OVERLAY ══ -->
<div class="alarm-overlay" id="alarmOverlay">
  <div class="alarm-box">
    <div class="alarm-icon">🚨</div>
    <div class="alarm-title">NEUER EINSATZ!</div>
    <div class="alarm-pid-big" id="alarmPid">–</div>
    <div class="alarm-schlw" id="alarmSchlw">–</div>
    <div class="alarm-detail" id="alarmDetail"></div>
    <button class="alarm-dismiss" id="alarmDismiss">✓ Quittieren</button>
  </div>
</div>

<!-- ══ TESTALARM OVERLAY ══ -->
<div class="alarm-overlay" id="testAlarmOverlay" style="background:rgba(180,120,0,0.82);">
  <div class="alarm-box" style="border-color:#f5c842;box-shadow:0 0 40px rgba(245,200,66,0.5);">
    <div class="alarm-icon">🔔</div>
    <div class="alarm-title" style="color:#f5c842;">TESTALARM</div>
    <div class="alarm-pid-big" style="font-size:1.4rem;margin-bottom:.8rem;" id="testAlarmText">–</div>
    <div style="font-size:.8rem;color:#ccc;margin-bottom:.6rem;">
      Dies ist kein echter Einsatz.<br>Quittiere zur Bestätigung.
    </div>
    <div style="margin-bottom:1.2rem;padding:.6rem .8rem;background:rgba(0,0,0,.35);border-radius:8px;border:1px solid rgba(245,200,66,0.3);">
      <div style="font-size:.7rem;color:#a6b3d1;margin-bottom:.3rem;">Startpunkt (teste den Link!):</div>
      <a id="testAlarmW3w" href="https://what3words.com/{{ startpunkt_w3w }}" target="_blank"
         style="color:#4ea1ff;font-size:.95rem;font-weight:600;text-decoration:none;">
        📍 ///{{ startpunkt_w3w }}
      </a>
    </div>
    <button class="alarm-dismiss" id="testAlarmDismiss" style="background:#f5c842;color:#000;">✓ Quittieren</button>
  </div>
</div>

<!-- ══ AKTIVIERUNGS-OVERLAY (Audio-Freischaltung) ══ -->
<div class="activate-overlay" id="activateOverlay">
  <div class="activate-box">
    <div class="act-icon">🔊</div>
    <div class="act-title">Alarmton aktivieren</div>
    <div class="act-desc">Tippe auf den Button, um Alarmsignale empfangen zu können.</div>
    <button class="activate-btn" id="activateBtn">Starten</button>
  </div>
</div>

<!-- ══ HEADER ══ -->
<div class="header">
  <h1>📱 EVT Mobile</h1>
  <span class="clock" id="clock"></span>
  <span class="gps-dot" id="gpsDot" title="Standort-Tracking ein/aus">
    <span class="gps-circle"></span>
    <span id="gpsLabel">GPS</span>
  </span>
  <span class="pulse-dot" id="pulseDot" title="Live-Verbindung"></span>
</div>

<!-- ══ CONTENT ══ -->
<div class="content">

  <!-- EVT Auswahl -->
  <div class="evt-selector">
    <label for="evtSelect">Ich bin:</label>
    <select id="evtSelect">
      <option value="">– EVT wählen –</option>
      {% for case_id in cases %}
      <option value="EVT {{ loop.index }}">EVT {{ loop.index }} ({{ case_id }})</option>
      {% endfor %}
    </select>
  </div>

  <!-- Dynamischer Bereich -->
  <div id="mainContent"></div>

</div>

<script>
// ── Daten aus Jinja ──────────────────────────────────────────
const CASES_META = {{ cases | tojson }};

const FMS_LABELS = {
  0: 'S0 prio. Sprechwunsch', 1: 'S1 Frei auf Funk', 2: 'S2 Frei auf Wache',
  3: 'S3 Einsatz übernommen', 4: 'S4 Am Einsatzort',  5: 'S5 Sprechwunsch',
  6: 'S6 n. einsatzbereit',   7: 'S7 Patient aufgen.', 8: 'S8 Am Transportziel', 9: 'S9 Sonderfunktion'
};

const FMS_COLORS = {
  0: '#ff3333', 1: '#22cc66', 2: '#0d7a3a',
  3: '#f5c842', 4: '#2299ff', 5: '#888888',
  6: '#888888', 7: '#ff8800', 8: '#9b59b6', 9: '#888888'
};

// ── State ────────────────────────────────────────────────────
let selectedEvt   = '';
let currentTeamId = null;
let currentRs     = null;
let pollHandle    = null;
// Quittierte Alarme persistent speichern (kein erneutes Overlay nach Reload)
let seenAlarms = new Set(JSON.parse(localStorage.getItem('evt_seenAlarms') || '[]'));
function _persistSeenAlarms() {
  localStorage.setItem('evt_seenAlarms', JSON.stringify([...seenAlarms]));
}

// ── HTML escaping ────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Uhrzeiten formatieren ─────────────────────────────────────
function fmtTime(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

// ── Uhr ──────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
tick();
setInterval(tick, 1000);

// ── EVT-Auswahl ───────────────────────────────────────────────
const evtSelect = document.getElementById('evtSelect');

// URL-Parameter ?team=EVT%201 → automatische Vorauswahl
const _urlTeam = new URLSearchParams(window.location.search).get('team');
if (_urlTeam) {
  // Sicherstellen dass die Option existiert
  for (const opt of evtSelect.options) {
    if (opt.value === _urlTeam) { evtSelect.value = _urlTeam; break; }
  }
  localStorage.setItem('evt_selected', evtSelect.value);
}

// Gespeicherte Auswahl laden (URL-Parameter hat Vorrang)
const savedEvt = _urlTeam || localStorage.getItem('evt_selected') || '';
if (savedEvt && !_urlTeam) evtSelect.value = savedEvt;

evtSelect.addEventListener('change', () => {
  _unlockAudio();  // Audio-Context beim ersten Tippen entsperren
  const v = evtSelect.value;
  localStorage.setItem('evt_selected', v);
  selectedEvt   = v;
  currentTeamId = null;
  currentRs     = null;
  stopGps();  // GPS stoppen bis Team-ID aus Poll bekannt
  if (pollHandle) clearInterval(pollHandle);
  if (v) {
    poll();
    pollHandle = setInterval(poll, 10000);
    // Push-Abo aktualisieren mit neuem EVT-Namen
    _updatePushSubscription(v);
  } else {
    document.getElementById('mainContent').innerHTML = '';
  }
});

async function _updatePushSubscription(evtName) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub && evtName) {
      await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ evt_name: evtName, subscription: sub.toJSON() }),
      });
    }
  } catch (_) {}
}

// Bei gespeicherter Auswahl: Aktivierungs-Overlay zeigen (Audio-Freischaltung)
if (savedEvt) {
  selectedEvt = savedEvt;
  document.getElementById('activateOverlay').classList.add('show');
}

document.getElementById('activateBtn').addEventListener('click', () => {
  _unlockAudio();  // Audio sofort freischalten per User-Geste
  document.getElementById('activateOverlay').classList.remove('show');
  poll();
  pollHandle = setInterval(poll, 5000);
});

// ── Polling ──────────────────────────────────────────────────
async function poll() {
  if (!selectedEvt) return;
  try {
    const res = await fetch(`/api/evt-status/${encodeURIComponent(selectedEvt)}`);
    if (!res.ok) { setDot(false); return; }
    const data = await res.json();
    setDot(true);

    if (data.team) {
      currentTeamId = data.team.id;
      currentRs     = data.team.radio_status;
      maybeStartGps();
    }

    // Echter Alarm erkennen
    const doc = data.case;
    if (doc && doc.alarm_time && !doc.completed) {
      const key = `${doc.id}:${doc.alarm_time}`;
      if (!seenAlarms.has(key)) {
        triggerAlarm(doc, data.case_meta);
      }
    }

    // Testalarm erkennen
    if (data.team && data.team.test_alarm_at) {
      showTestAlarm(data.team);
    }

    renderMain(data.team, data.case, data.case_meta);
  } catch (e) {
    setDot(false);
  }
}

function setDot(ok) {

// ── Alarmton (Pre-rendered WAV + <audio> Element) ───────────────
// Mobile Browser erlauben Audio nur nach Nutzerinteraktion.
// Trick: WAV bei Gesture vorrendern → <audio>.play() bei Gesture "freischalten"
// → danach kann .play() auch aus fetch-Callbacks aufgerufen werden.

let _alarmAudio = null;   // <audio> für echten Alarm
let _testAudio  = null;   // <audio> für Testalarm
let _audioReady = false;

// WAV-Datei programmatisch erzeugen (PCM 16-bit, 22050 Hz, mono)
function _generateWav(sampleRate, samples) {
  const n = samples.length;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  function str(o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
  str(0,'RIFF'); v.setUint32(4, 36 + n*2, true); str(8,'WAVE');
  str(12,'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, sampleRate, true);
  v.setUint32(28, sampleRate*2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36,'data'); v.setUint32(40, n*2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i*2, Math.max(-32768, Math.min(32767, samples[i]*32767)), true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

// Alarm-Ton generieren: 3x (880-660-880-660-880 Hz Square wave), ~3s
function _renderAlarmWav() {
  const sr = 22050;
  const base = [
    { freq: 880, start: 0.0,  dur: 0.18 },
    { freq: 660, start: 0.22, dur: 0.18 },
    { freq: 880, start: 0.44, dur: 0.18 },
    { freq: 660, start: 0.66, dur: 0.18 },
    { freq: 880, start: 0.88, dur: 0.12 },
  ];
  const totalSec = 3.5;
  const samples = new Float32Array(Math.ceil(sr * totalSec));
  for (let round = 0; round < 3; round++) {
    const off = round * 1.1;
    base.forEach(({ freq, start, dur }) => {
      const s0 = Math.floor((off + start) * sr);
      const s1 = Math.floor((off + start + dur) * sr);
      for (let i = s0; i < s1 && i < samples.length; i++) {
        const t = (i - s0) / sr;
        const env = Math.max(0, 1 - t / dur);  // fade out
        samples[i] += (((i * freq / sr) % 1) < 0.5 ? 0.4 : -0.4) * env;
      }
    });
  }
  return _generateWav(sr, samples);
}

// Testalarm-Ton: 3x (440-550-660-550-440 Hz Sine wave), ~2.5s
function _renderTestWav() {
  const sr = 22050;
  const base = [
    { freq: 440, start: 0.0,  dur: 0.10 },
    { freq: 550, start: 0.15, dur: 0.10 },
    { freq: 660, start: 0.30, dur: 0.10 },
    { freq: 550, start: 0.45, dur: 0.10 },
    { freq: 440, start: 0.60, dur: 0.15 },
  ];
  const totalSec = 2.5;
  const samples = new Float32Array(Math.ceil(sr * totalSec));
  for (let round = 0; round < 3; round++) {
    const off = round * 0.9;
    base.forEach(({ freq, start, dur }) => {
      const s0 = Math.floor((off + start) * sr);
      const s1 = Math.floor((off + start + dur) * sr);
      for (let i = s0; i < s1 && i < samples.length; i++) {
        const t = (i - s0) / sr;
        const env = Math.max(0, 1 - t / dur);
        samples[i] += Math.sin(2 * Math.PI * freq * (i / sr)) * 0.35 * env;
      }
    });
  }
  return _generateWav(sr, samples);
}

function _unlockAudio() {
  if (_audioReady) return;
  try {
    // WAV-Blobs erzeugen
    const alarmUrl = _renderAlarmWav();
    const testUrl  = _renderTestWav();

    _alarmAudio = new Audio(alarmUrl);
    _testAudio  = new Audio(testUrl);

    // "Freischalten": kurz play() + sofort pause() → Browser merkt sich Autorisierung
    _alarmAudio.volume = 0.01;
    _alarmAudio.play().then(() => {
      _alarmAudio.pause();
      _alarmAudio.currentTime = 0;
      _alarmAudio.volume = 1.0;
    }).catch(() => {});

    _testAudio.volume = 0.01;
    _testAudio.play().then(() => {
      _testAudio.pause();
      _testAudio.currentTime = 0;
      _testAudio.volume = 1.0;
    }).catch(() => {});

    _audioReady = true;
  } catch (e) { /* kein Audio-Support */ }
}

// Audio bei JEDER Nutzerinteraktion freischalten
['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
  document.addEventListener(evt, _unlockAudio, { passive: true });
});

function _playAlarmTone() {
  if (!_alarmAudio) return;
  try {
    _alarmAudio.currentTime = 0;
    _alarmAudio.volume = 1.0;
    _alarmAudio.play().catch(() => {});
  } catch (_) {}
}

function _playTestAlarmTone() {
  if (!_testAudio) return;
  try {
    _testAudio.currentTime = 0;
    _testAudio.volume = 1.0;
    _testAudio.play().catch(() => {});
  } catch (_) {}
}

// ── Notification Permission ──────────────────────────────────
function _requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}
['click', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, _requestNotificationPermission, { once: true, passive: true });
});

function _showNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification(title, {
      body: body,
      tag: 'alarm',
      requireInteraction: true,
      vibrate: [400, 120, 400, 120, 800],
    });
  } catch (_) {}
}

let _alarmDoc = null;

function triggerAlarm(doc, meta) {

  seenAlarms.add(key);  // schon jetzt als gesehen markieren, verhindert Doppelt-Anzeige

  _alarmDoc = doc;

  if (meta) {

    if (patName)  detail += `<div>Patient: <span class="alarm-patient">${esc(patName)}</span></div>`;
    if (w3wAlarm) detail += `<div>Ort: <span class="alarm-w3w">${esc(w3wAlarm)}</span></div>`;

  } else {

      <div class="no-case">

  }

  // FMS-Tasten (Ziffernblock-Reihenfolge: 1-2-3 / 4-5-6 / 7-8-9 / 0)

    { rs: 1, cls: 'b-s1', code: 'S1', sub: 'Frei auf Funk'    },

  document.getElementById('mainContent').innerHTML = `

// ── FMS setzen ───────────────────────────────────────────────
async function setFms(rs) {
  if (!currentTeamId) {
    alert(`Team "${selectedEvt}" nicht in DB. Bitte im Einsatzleiter anlegen.`);
    return;
  }
  try {
    const res = await fetch(`/api/teams/${currentTeamId}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ radio_status: rs }),
    });
    if (res.ok) {
      const t = await res.json();
      currentRs = t.radio_status;
      await poll();
    }
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

// ── GPS-Standort-Tracking ─────────────────────────────────────
let _gpsWatchId   = null;
let _gpsFallback  = null;   // Fallback-Intervall für iOS
let _gpsEnabled   = (localStorage.getItem('evt_gps') !== '0');  // default: ein
let _lastGpsLat   = null;
let _lastGpsLng   = null;
let _lastGpsSent  = 0;
let _gpsGotFix    = false;  // true sobald erster Fix kam

const GPS_SEND_INTERVAL = 10000;  // mindestens alle 10 s senden
const GPS_MIN_METERS    = 5;      // nur senden wenn >5 m Bewegung ODER Interval abgelaufen

function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function _setGpsDot(state, label) {
  const dot = document.getElementById('gpsDot');
  const lbl = document.getElementById('gpsLabel');
  if (!dot) return;
  dot.className = 'gps-dot ' + (state || '');
  if (lbl) lbl.textContent = label || 'GPS';
}

async function _sendGps(lat, lng) {
  if (!currentTeamId) return;
  try {
    await fetch(`/api/teams/${currentTeamId}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ lat, lng, gps: true }),
    });
    _lastGpsLat  = lat;
    _lastGpsLng  = lng;
    _lastGpsSent = Date.now();
  } catch (_) { /* silent */ }
}

function _onGpsPosition(pos) {
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  const acc = Math.round(accuracy);
  _gpsGotFix = true;
  // Farbfeedback: grün ≤10m, gelb ≤50m, orange >50m
  const accClass = acc <= 10 ? 'acc-good' : acc <= 50 ? 'acc-fair' : 'acc-poor';
  _setGpsDot('active ' + accClass, `±${acc}m`);

  const moved = (_lastGpsLat == null)
    ? 999
    : haversineM(_lastGpsLat, _lastGpsLng, lat, lng);
  const timeDue = (Date.now() - _lastGpsSent) >= GPS_SEND_INTERVAL;

  if (moved >= GPS_MIN_METERS || timeDue) {
    _sendGps(lat, lng);
  }
}

function _onGpsError(err) {
  if (err.code === 1) {
    // Permission denied – hilfreiche Anleitung zeigen
    _setGpsDot('error', 'GPS blockiert');
    _showGpsHelp();
  } else {
    const msgs = { 2: 'kein Signal', 3: 'Timeout' };
    _setGpsDot('error', msgs[err.code] || 'GPS-Fehler');
  }
}

// iOS Safari: watchPosition feuert oft nicht zuverlässig.
// Workaround: erst getCurrentPosition aufrufen (triggert Permission-Dialog),
// dann watchPosition + Fallback-Polling alle 15s mit getCurrentPosition.
function startGps() {
  if (!navigator.geolocation) {
    _setGpsDot('error', 'nicht unterstützt');
    return;
  }
  // HTTPS-Check (Geolocation braucht Secure Context)
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    _setGpsDot('error', 'HTTPS nötig');
    return;
  }
  _setGpsDot('waiting', 'Suche…');
  _gpsGotFix = false;

  const opts = { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 };

  // 1) getCurrentPosition – triggert iOS-Permission-Dialog zuverlässig
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      _onGpsPosition(pos);
      _startWatch(opts);
    },
    (err) => {
      _onGpsError(err);
      _startWatch(opts);  // trotzdem versuchen
    },
    opts
  );
}

function _startWatch(opts) {
  // 2) watchPosition für kontinuierliche Updates
  if (_gpsWatchId == null) {
    _gpsWatchId = navigator.geolocation.watchPosition(
      _onGpsPosition,
      _onGpsError,
      opts
    );
  }

  // 3) Fallback-Polling für iOS: alle 15s getCurrentPosition
  //    (fängt Fälle ab wo watchPosition aufhört zu feuern)
  if (!_gpsFallback) {
    _gpsFallback = setInterval(() => {
      if (!_gpsEnabled || !currentTeamId) return;
      navigator.geolocation.getCurrentPosition(
        _onGpsPosition,
        () => {},  // stille Fehler im Fallback
        { enableHighAccuracy: true, maximumAge: 20000, timeout: 15000 }
      );
    }, 15000);
  }
}

function stopGps() {
  if (_gpsWatchId != null) {
    navigator.geolocation.clearWatch(_gpsWatchId);
    _gpsWatchId = null;
  }
  if (_gpsFallback) {
    clearInterval(_gpsFallback);
    _gpsFallback = null;
  }
  _gpsGotFix = false;
  _setGpsDot('', 'GPS aus');
}

// Initialer GPS-Dot-Status beim Laden
_setGpsDot(_gpsEnabled ? 'waiting' : '', _gpsEnabled ? 'GPS' : 'GPS aus');

// Toggle per Klick auf GPS-Dot
document.getElementById('gpsDot').addEventListener('click', () => {
  _gpsEnabled = !_gpsEnabled;
  localStorage.setItem('evt_gps', _gpsEnabled ? '1' : '0');
  if (_gpsEnabled && currentTeamId) {
    startGps();
  } else {
    stopGps();
  }
});

// GPS automatisch starten wenn EVT ausgewählt und Tracking aktiviert
function maybeStartGps() {
  if (_gpsEnabled && currentTeamId) {
    if (_gpsWatchId == null) startGps();
  }
}

// ── Service Worker + Web-Push ────────────────────────────────
(async function registerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/static/sw.js');

    // VAPID-Public-Key vom Server holen
    const keyRes = await fetch('/api/push/vapid-key');
    const keyData = await keyRes.json();
    if (!keyData.publicKey) return;

    // URL-safe base64 → Uint8Array
    const rawKey = keyData.publicKey.replace(/-/g,'+').replace(/_/g,'/');
    const pad = '='.repeat((4 - rawKey.length % 4) % 4);
    const bytes = atob(rawKey + pad);
    const applicationServerKey = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) applicationServerKey[i] = bytes.charCodeAt(i);

    // Notification-Permission anfragen
    if (Notification.permission === 'default') {
      await Notification.requestPermission();
    }

    // Push-Subscription (erstellt Browser-seitig Schlüsselpaar)
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: applicationServerKey,
      });
    }

    // Subscription + EVT-Name an Server senden
    const evtName = selectedEvt || localStorage.getItem('evt_selected') || '';
    if (evtName && sub) {
      await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ evt_name: evtName, subscription: sub.toJSON() }),
      });
    }
  } catch (_) { /* Push nicht verfügbar */ }
})();
</script>
