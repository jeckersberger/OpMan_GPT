<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>OpMan-GPT – Anmeldung</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b1220; color: #e7eefc;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1rem;
    }
    .login-box {
      background: #111b2e; border: 1px solid #223152; border-radius: 12px;
      padding: 2rem; width: 100%; max-width: 360px; text-align: center;
    }
    .login-box h1 {
      font-size: 1.2rem; margin-bottom: .3rem; color: #fff;
    }
    .login-box .sub {
      font-size: .85rem; color: #a6b3d1; margin-bottom: 1.5rem;
    }
    .field {
      margin-bottom: 1rem; text-align: left;
    }
    .field label {
      display: block; font-size: .8rem; color: #a6b3d1; margin-bottom: .4rem;
      font-weight: 600;
    }
    .field input {
      width: 100%; padding: .7rem .8rem; font-size: .95rem;
      background: #0d1a2e; border: 1px solid #223152; border-radius: 8px;
      color: #e7eefc; font-family: inherit;
      outline: none; transition: border-color .15s;
    }
    .field input:focus {
      border-color: #4ea1ff;
    }
    .field input.error {
      border-color: #ef4444;
    }
    .btn-login {
      width: 100%; padding: .75rem; font-size: 1rem; font-weight: 700;
      background: #4ea1ff; color: #fff; border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit; margin-top: .5rem;
      transition: opacity .15s;
    }
    .btn-login:hover { opacity: .85; }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }
    .error-msg {
      color: #ef4444; font-size: .85rem; margin-top: 1rem;
      min-height: 1.2em;
    }
    .brk-logo {
      font-size: 2rem; margin-bottom: .5rem;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="brk-logo">&#x1F6A8;</div>
  <h1>OpMan-GPT</h1>
  <div class="sub">Bitte anmelden um fortzufahren</div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="field">
      <label for="user">Benutzer</label>
      <input type="text" id="user" name="user" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             placeholder="Benutzer" required />
    </div>
    <div class="field">
      <label for="pass">Passwort</label>
      <input type="password" id="pass" name="pass" autocomplete="current-password"
             placeholder="Passwort" required />
    </div>
    <button type="submit" class="btn-login" id="btnLogin">Anmelden</button>
  </form>

  <div class="error-msg" id="error"></div>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  var user = document.getElementById('user').value.trim();
  var pass = document.getElementById('pass').value;
  var errorEl = document.getElementById('error');
  var btn = document.getElementById('btnLogin');

  errorEl.textContent = '';
  document.getElementById('user').classList.remove('error');
  document.getElementById('pass').classList.remove('error');

  if (!user || !pass) {
    errorEl.textContent = 'Bitte beide Felder ausfuellen';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Anmelden\u2026';

  try {
    var res = await fetch('/api/site-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: user, pass: pass }),
    });
    var data = await res.json();
    if (data.ok) {
      window.location.reload();
    } else {
      document.getElementById('user').classList.add('error');
      document.getElementById('pass').classList.add('error');
      errorEl.textContent = data.error || 'Falsche Zugangsdaten';
      btn.disabled = false;
      btn.textContent = 'Anmelden';
    }
  } catch (err) {
    errorEl.textContent = 'Verbindungsfehler';
    btn.disabled = false;
    btn.textContent = 'Anmelden';
  }
}

// Auto-Focus auf erstes Feld
document.getElementById('user').focus();
</script>

</body>
</html>
