<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Einsatz-Auswertung – BRK Übung Feucht</title>
  <style>
    :root {
      --bg:      #0b1220;
      --panel:   #111b2e;
      --panel2:  #162035;
      --text:    #e7eefc;
      --accent:  #4ea1ff;
      --green:   #3ddc84;
      --yellow:  #f5c842;
      --red:     #ff4f4f;
      --orange:  #ff9f43;
      --muted:   #a6b3d1;
      --border:  #223152;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── Topbar ── */
    .topbar {
      display:flex; align-items:center; gap:.75rem; padding:0 1.1rem;
      height:52px; background:var(--panel); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:100;
    }
    .topbar a.back {
      color:var(--accent); text-decoration:none; font-size:.82rem;
      padding:.28rem .65rem; border:1px solid var(--accent); border-radius:6px; white-space:nowrap;
    }
    .topbar a.back:hover { background:rgba(78,161,255,.12); }
    .topbar h1 { font-size:.95rem; font-weight:700; flex:1; }
    .topbar nav { display:flex; gap:.5rem; align-items:center; }
    .topbar nav a { color:var(--accent); text-decoration:none; font-size:.8rem; padding:.3rem .6rem; border:1px solid var(--border); border-radius:6px; white-space:nowrap; }
    .topbar nav a:hover { background:rgba(78,161,255,.12); }

    .btn {
      padding:.32rem .7rem; border-radius:6px; border:none; cursor:pointer;
      font-size:.8rem; font-family:inherit; font-weight:600; transition:opacity .15s; white-space:nowrap;
    }
    .btn:hover { opacity:.85; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-success { background:var(--green);  color:#000; }
    .btn-warn    { background:var(--yellow); color:#000; }
    .btn-danger  { background:var(--red);    color:#fff; }
    .btn-ghost   { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-orange  { background:var(--orange); color:#000; }
    .btn-sm      { padding:.2rem .45rem; font-size:.74rem; }

    /* ── Team Selector Tabs ── */
    .team-tabs {
      display:flex; gap:.4rem; padding:.8rem 1.1rem .4rem; max-width:1400px; margin:0 auto;
      flex-wrap:wrap; align-items:center;
    }
    .team-tab {
      padding:.4rem .9rem; border-radius:8px; border:1px solid var(--border);
      background:var(--panel); color:var(--muted); cursor:pointer;
      font-size:.82rem; font-weight:600; font-family:inherit; transition:all .15s;
      white-space:nowrap;
    }
    .team-tab:hover { background:var(--panel2); color:var(--text); border-color:var(--accent); }
    .team-tab.active {
      background:var(--accent); color:#fff; border-color:var(--accent);
    }

    /* ── Main Content ── */
    .container { padding:1rem 1.1rem 1.5rem; max-width:1400px; margin:0 auto; }

    /* ── Sections ── */
    .section { margin-bottom:2rem; }
    .section-title {
      font-size:.85rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      color:var(--muted); margin-bottom:1rem; display:flex; align-items:center; gap:.5rem;
    }

    /* ── Case Cards ── */
    .case-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(600px,1fr)); gap:1rem; }
    .case-card {
      background:var(--panel); border:1px solid var(--border); border-radius:10px;
      overflow:hidden; padding:1rem;
    }
    .case-card.completed { border-color:var(--green); }

    .case-header {
      display:flex; align-items:center; gap:.6rem; margin-bottom:1rem; padding-bottom:.8rem;
      border-bottom:1px solid var(--border);
    }
    .case-id {
      font-size:1.2rem; font-weight:800; background:var(--accent); color:#fff;
      padding:.1rem .55rem; border-radius:6px; flex-shrink:0;
    }
    .case-id.completed { background:var(--green); color:#000; }
    .case-schlagwort { font-size:.85rem; font-weight:600; flex:1; }
    .case-patient { font-size:.75rem; color:var(--muted); }

    /* ── Timings Table ── */
    .timings-table {
      width:100%; border-collapse:collapse; font-size:.8rem; margin-bottom:1rem;
    }
    .timings-table th {
      background:var(--panel2); padding:.4rem .5rem; text-align:left; font-weight:700;
      border-bottom:1px solid var(--border); color:var(--muted);
    }
    .timings-table td {
      padding:.4rem .5rem; border-bottom:1px solid var(--border);
    }
    .timings-table tr:last-child td { border-bottom:none; }

    .timing-label { color:var(--muted); }
    .timing-value { font-weight:700; font-family:monospace; }
    .timing-good { color:var(--green); }
    .timing-bad { color:var(--red); }
    .timing-slow { color:var(--orange); }

    /* ── Timeline ── */
    .timeline {
      position:relative; padding:1rem 0; margin:1rem 0;
    }
    .timeline-event {
      display:flex; margin-bottom:.8rem; font-size:.78rem;
    }
    .timeline-marker {
      min-width:80px; font-weight:600; color:var(--accent);
    }
    .timeline-bar {
      flex:1; background:var(--panel2); border-radius:4px; padding:.3rem .5rem;
      border-left:3px solid var(--accent);
    }
    .timeline-bar.green { border-left-color:var(--green); }
    .timeline-bar.yellow { border-left-color:var(--yellow); }
    .timeline-bar.red { border-left-color:var(--red); }
    .timeline-bar.orange { border-left-color:var(--orange); }

    /* ── PZC-Auswertung ── */
    .pzc-grid { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; margin:1rem 0; }
    .pzc-item {
      background:var(--panel2); border-radius:8px; padding:.6rem;
      border-left:3px solid var(--border);
    }
    .pzc-item.correct { border-left-color:var(--green); background:rgba(61,220,132,.07); }
    .pzc-item.wrong { border-left-color:var(--red); background:rgba(255,79,79,.07); }
    .pzc-label { font-size:.7rem; color:var(--muted); margin-bottom:.2rem; }
    .pzc-value { font-size:.95rem; font-weight:700; font-family:monospace; }

    /* ── ABCD-Bewertung ── */
    .abcd-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin:1rem 0; }
    .abcd-item {
      background:var(--panel2); border:1px solid var(--border); border-radius:6px;
      padding:.5rem; text-align:center;
    }
    .abcd-item.correct { background:rgba(61,220,132,.15); border-color:var(--green); }
    .abcd-item.almost { background:rgba(245,200,66,.15); border-color:var(--yellow); }
    .abcd-item.wrong { background:rgba(255,79,79,.15); border-color:var(--red); }
    .abcd-label { font-size:.65rem; color:var(--muted); font-weight:600; }
    .abcd-soll { font-size:.8rem; color:var(--yellow); }
    .abcd-ist { font-size:.8rem; font-weight:700; margin-top:.2rem; }

    /* ── EVT-Vergleich ── */
    .evt-comparison {
      background:var(--panel2); border:1px solid var(--border); border-radius:8px;
      padding:1rem; margin:1rem 0;
    }
    .evt-row {
      display:flex; align-items:center; gap:.5rem; padding:.5rem 0;
      border-bottom:1px solid var(--border);
    }
    .evt-row:last-child { border-bottom:none; }
    .evt-name { min-width:100px; font-weight:700; }
    .evt-time { flex:1; font-family:monospace; font-size:.8rem; }
    .evt-bar-bg {
      flex:2; background:var(--panel); border-radius:4px; height:18px; overflow:hidden;
    }
    .evt-bar-fill {
      height:100%; border-radius:4px; transition:width .3s ease;
    }

    /* ── Summary ── */
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin:1rem 0; }
    .summary-card {
      background:var(--panel2); border:1px solid var(--border); border-radius:8px;
      padding:1rem; text-align:center;
    }
    .summary-label { font-size:.75rem; color:var(--muted); margin-bottom:.3rem; }
    .summary-value { font-size:1.3rem; font-weight:800; font-family:monospace; }
    .summary-value.good { color:var(--green); }
    .summary-value.warn { color:var(--yellow); }
    .summary-value.bad { color:var(--red); }

    /* ── No-data message ── */
    .no-data {
      text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.9rem;
    }

    /* ── Print ── */
    @media print {
      .topbar, .btn, button, .team-tabs { display:none; }
      .container { max-width:100%; padding:0; }
      .case-card { page-break-inside:avoid; }
      body { background:white; color:black; }
    }

    /* ── Responsive ── */
    @media (max-width:768px) {
      .case-grid { grid-template-columns:1fr; }
      .pzc-grid { grid-template-columns:1fr; }
      .abcd-grid { grid-template-columns:repeat(2,1fr); }
      .summary-grid { grid-template-columns:1fr; }
      .team-tabs { gap:.3rem; }
      .team-tab { font-size:.75rem; padding:.35rem .6rem; }
    }
  </style>
</head>
<body>
  <!-- Topbar -->
  <header class="topbar">
    <a href="/" class="back">&larr; Zur&uuml;ck</a>
    <h1>&#x1F4CA; Einsatz-Auswertung</h1>
    <nav>
      <a href="/">&#x1F5FA; Karte</a>
      <a href="/protokoll">&#x1F4CB; Protokoll</a>
      <a href="/cases">&#x1F4DD; F&auml;lle</a>
      <a href="/beobachter">&#x1F441; Beobachter</a>
    </nav>
    <button class="btn btn-primary" onclick="window.print()">&#x1F5A8; Drucken</button>
  </header>

  <!-- Team Selector Tabs -->
  <div class="team-tabs" id="teamTabs" style="display:none;"></div>

  <!-- Main Content -->
  <div class="container">
    <div id="loading" style="text-align:center;padding:2rem;color:var(--muted);">
      Daten werden geladen&hellip;
    </div>

    <div id="content" style="display:none;">
      <!-- Summary -->
      <div class="section">
        <h2 class="section-title" id="sectionTitle">&#x1F4C8; &Uuml;bersicht</h2>
        <div class="summary-grid" id="summaryGrid"></div>
      </div>

      <!-- Detailauswertung pro Fall -->
      <div class="section">
        <h2 class="section-title">&#x1F3AF; Auswertung pro Fall</h2>
        <div class="case-grid" id="caseGrid"></div>
      </div>

      <!-- EVT-Vergleich (nur in "Alle"-Ansicht) -->
      <div class="section" id="evtComparisonSection" style="display:none;">
        <h2 class="section-title">&#x1F691; Vergleich EVT-Teams</h2>
        <div id="evtComparison"></div>
      </div>
    </div>
  </div>

  <script>
    let _auswertungData = null;
    let _activeTab = '__all__';

    /* ── Load data ── */
    async function loadAuswertung() {
      try {
        const res = await fetch('/api/auswertung');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Unbekannter Fehler');
        _auswertungData = data;
        buildTeamTabs(data);
        showTab('__all__');
      } catch (err) {
        document.getElementById('loading').innerHTML = '&#x274C; Fehler beim Laden: ' + err.message;
      }
    }

    /* ── Build team selector tabs ── */
    function buildTeamTabs(data) {
      const container = document.getElementById('teamTabs');
      let html = '<button class="team-tab active" data-tab="__all__" onclick="showTab(\'__all__\')">Alle</button>';
      (data.teams || []).forEach(t => {
        const name = t.evt_name;
        const esc = name.replace(/'/g, "\\'");
        html += '<button class="team-tab" data-tab="' + name + '" onclick="showTab(\'' + esc + '\')">'
              + name
              + ' <span style="font-size:.7rem;color:var(--muted);margin-left:.3rem;">'
              + t.cases_assigned + '/' + t.cases_total
              + '</span></button>';
      });
      container.innerHTML = html;
      container.style.display = 'flex';
    }

    /* ── Switch tab ── */
    function showTab(tabId) {
      _activeTab = tabId;
      document.querySelectorAll('.team-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
      });
      if (tabId === '__all__') {
        renderOverview(_auswertungData);
      } else {
        const team = (_auswertungData.teams || []).find(t => t.evt_name === tabId);
        if (team) {
          renderTeamView(team);
        }
      }
    }

    /* ── Render helpers ── */
    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return '-';
      const mins = Math.floor(seconds / 60);
      const secs = Math.round(seconds % 60);
      return mins + ':' + String(secs).padStart(2, '0') + ' min';
    }

    function formatTime(isoStr) {
      if (!isoStr) return '-';
      const dt = new Date(isoStr);
      return dt.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }

    function getDurationColor(seconds, slowThreshold, goodThreshold) {
      if (seconds === null || seconds === undefined) return '';
      if (seconds <= goodThreshold) return 'green';
      if (seconds <= slowThreshold) return 'yellow';
      return 'red';
    }

    /* ── Render "Alle" overview ── */
    function renderOverview(data) {
      const cases = data.all_cases || [];
      const teams = data.teams || [];

      document.getElementById('sectionTitle').innerHTML = '&#x1F4C8; Gesamt&uuml;bersicht';

      // Summary
      let totalDuration = 0, completedCount = 0;
      cases.forEach(c => {
        if (c.total_seconds !== null && c.total_seconds !== undefined) {
          totalDuration += c.total_seconds;
          completedCount++;
        }
      });

      document.getElementById('summaryGrid').innerHTML =
        '<div class="summary-card">' +
          '<div class="summary-label">F&auml;lle gesamt</div>' +
          '<div class="summary-value">' + cases.length + '</div>' +
        '</div>' +
        '<div class="summary-card">' +
          '<div class="summary-label">Abgeschlossen</div>' +
          '<div class="summary-value ' + (completedCount === cases.length && cases.length > 0 ? 'good' : '') + '">' + completedCount + '/' + cases.length + '</div>' +
        '</div>' +
        '<div class="summary-card">' +
          '<div class="summary-label">&#x2205; Einsatzdauer</div>' +
          '<div class="summary-value ' + (completedCount > 0 ? 'good' : '') + '">' + (completedCount > 0 ? formatDuration(totalDuration / completedCount) : '-') + '</div>' +
        '</div>' +
        '<div class="summary-card">' +
          '<div class="summary-label">EVT-Teams</div>' +
          '<div class="summary-value">' + teams.length + '</div>' +
        '</div>';

      // Case cards (from all_cases)
      renderCaseCards(cases);

      // EVT comparison
      renderEvtComparison(data);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    /* ── Render single team view ── */
    function renderTeamView(team) {
      document.getElementById('sectionTitle').innerHTML = '&#x1F4C8; ' + team.evt_name;

      // Summary for this team
      const cases = team.cases || [];
      let totalDuration = 0, completedCount = 0;
      cases.forEach(c => {
        if (c.total_seconds !== null && c.total_seconds !== undefined) {
          totalDuration += c.total_seconds;
          completedCount++;
        }
      });

      document.getElementById('summaryGrid').innerHTML =
        '<div class="summary-card">' +
          '<div class="summary-label">Zugewiesene F&auml;lle</div>' +
          '<div class="summary-value">' + team.cases_assigned + '/' + team.cases_total + '</div>' +
        '</div>' +
        '<div class="summary-card">' +
          '<div class="summary-label">Abgeschlossen</div>' +
          '<div class="summary-value ' + (team.cases_completed === team.cases_assigned && team.cases_assigned > 0 ? 'good' : '') + '">' + team.cases_completed + '/' + team.cases_assigned + '</div>' +
        '</div>' +
        '<div class="summary-card">' +
          '<div class="summary-label">&#x2205; Einsatzdauer</div>' +
          '<div class="summary-value ' + (team.avg_total_seconds ? 'good' : '') + '">' + (team.avg_total_seconds ? formatDuration(team.avg_total_seconds) : '-') + '</div>' +
        '</div>';

      // Case cards for this team
      renderCaseCards(cases);

      // Hide EVT comparison in single-team view
      document.getElementById('evtComparisonSection').style.display = 'none';

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    /* ── Render case cards (shared) ── */
    function renderCaseCards(cases) {
      if (!cases.length) {
        document.getElementById('caseGrid').innerHTML = '<div class="no-data">Keine F&auml;lle verf&uuml;gbar</div>';
        return;
      }

      let html = '';
      cases.forEach(c => {
        const isCompleted = c.total_seconds !== null && c.total_seconds !== undefined;

        // Timeline
        let tl = '';
        if (c.alarm_time) {
          tl += '<div class="timeline-event">' +
            '<div class="timeline-marker">Alarm</div>' +
            '<div class="timeline-bar">' + formatTime(c.alarm_time) + '</div></div>';
        }
        if (c.status3_time) {
          const d = c.s3_seconds;
          const col = getDurationColor(d, 180, 120);
          tl += '<div class="timeline-event">' +
            '<div class="timeline-marker">S3 (' + Math.round(d) + 's)</div>' +
            '<div class="timeline-bar ' + col + '">' + formatTime(c.status3_time) + ' | Ausr&uuml;ckzeit: ' + formatDuration(d) + '</div></div>';
        }
        if (c.status4_time) {
          const d = c.s4_seconds;
          const col = getDurationColor(d, 600, 300);
          tl += '<div class="timeline-event">' +
            '<div class="timeline-marker">S4 (' + Math.round(d) + 's)</div>' +
            '<div class="timeline-bar ' + col + '">' + formatTime(c.status4_time) + ' | Anfahrt: ' + formatDuration(d) + '</div></div>';
        }
        if (c.status7_time) {
          const d = c.s7_seconds;
          const col = getDurationColor(d, 900, 600);
          tl += '<div class="timeline-event">' +
            '<div class="timeline-marker">S7 (' + Math.round(d) + 's)</div>' +
            '<div class="timeline-bar ' + col + '">' + formatTime(c.status7_time) + ' | Vor-Ort: ' + formatDuration(d) + '</div></div>';
        }
        if (c.status8_time) {
          const d = c.s8_seconds;
          const col = getDurationColor(d, 600, 300);
          tl += '<div class="timeline-event">' +
            '<div class="timeline-marker">S8 (' + Math.round(d) + 's)</div>' +
            '<div class="timeline-bar ' + col + '">' + formatTime(c.status8_time) + ' | Transport: ' + formatDuration(d) + '</div></div>';
        }

        // PZC
        let pzcHtml = '';
        if (c.pzc_soll || c.pzc_reported) {
          const correct = c.pzc_soll === c.pzc_reported;
          pzcHtml =
            '<div class="pzc-grid">' +
              '<div class="pzc-item ' + (correct ? 'correct' : 'wrong') + '">' +
                '<div class="pzc-label">PZC (Soll)</div>' +
                '<div class="pzc-value" style="color:var(--yellow);">' + (c.pzc_soll || '-') + '</div>' +
              '</div>' +
              '<div class="pzc-item ' + (correct ? 'correct' : 'wrong') + '">' +
                '<div class="pzc-label">PZC (Gemeldet)</div>' +
                '<div class="pzc-value" style="color:' + (correct ? 'var(--green)' : 'var(--red)') + ';">' + (c.pzc_reported || '-') + '</div>' +
              '</div>' +
            '</div>';
        }

        // ABCD
        let abcdHtml = '';
        if (c.abcd_soll || c.abcd_reported) {
          const soll = c.abcd_soll || {};
          const ist = c.abcd_reported || {};
          abcdHtml = '<div class="abcd-grid">';
          ['A','B','C','D'].forEach(s => {
            const sollVal = soll[s] || '-';
            const istVal = ist[s] || '-';
            const match = sollVal === '-' || sollVal === istVal;
            const almostMatch = sollVal !== '-' && !isNaN(sollVal) && !isNaN(istVal) && Math.abs(sollVal - istVal) <= 1;
            const cls = match ? 'correct' : almostMatch ? 'almost' : 'wrong';
            abcdHtml +=
              '<div class="abcd-item ' + cls + '">' +
                '<div class="abcd-label">' + s + '</div>' +
                '<div class="abcd-soll">Soll: ' + sollVal + '</div>' +
                '<div class="abcd-ist">Ist: ' + istVal + '</div>' +
              '</div>';
          });
          abcdHtml += '</div>';
        }

        // Assigned EVT badge (only in "Alle" view)
        let evtBadge = '';
        if (_activeTab === '__all__' && c.assigned_evt) {
          evtBadge = '<span style="font-size:.7rem;background:var(--panel2);color:var(--accent);padding:.15rem .4rem;border-radius:4px;margin-left:auto;white-space:nowrap;">' + c.assigned_evt + '</span>';
        }

        html +=
          '<div class="case-card ' + (isCompleted ? 'completed' : '') + '">' +
            '<div class="case-header">' +
              '<div class="case-id ' + (isCompleted ? 'completed' : '') + '">' + c.case_id + '</div>' +
              '<div>' +
                '<div class="case-schlagwort">' + c.schlagwort + '</div>' +
                '<div class="case-patient">' + c.patient + '</div>' +
              '</div>' +
              evtBadge +
            '</div>' +
            '<div class="timeline">' +
              (tl || '<p style="color:var(--muted);font-size:.8rem;">Noch nicht alarmiert</p>') +
            '</div>' +
            pzcHtml +
            abcdHtml +
            (isCompleted
              ? '<div style="background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.3);border-radius:6px;padding:.6rem;margin-top:1rem;font-size:.8rem;">' +
                  '<strong style="color:var(--green);">&#x2713; Gesamtdauer: ' + formatDuration(c.total_seconds) + '</strong>' +
                '</div>'
              : '') +
          '</div>';
      });

      document.getElementById('caseGrid').innerHTML = html;
    }

    /* ── EVT comparison (overview tab only) ── */
    function renderEvtComparison(data) {
      const teams = data.teams || [];
      if (teams.length < 2) {
        document.getElementById('evtComparisonSection').style.display = 'none';
        return;
      }

      // Find the max avg for bar scaling
      const maxAvg = Math.max(...teams.map(t => t.avg_total_seconds || 0), 1);

      // Per-team summary comparison
      let html = '<div class="evt-comparison">' +
        '<h4 style="font-size:.85rem;margin-bottom:.8rem;color:var(--accent);">Durchschnittliche Einsatzdauer</h4>';
      const teamColors = ['var(--accent)', 'var(--green)', 'var(--orange)', 'var(--yellow)', 'var(--red)', '#c084fc', '#f472b6'];

      teams.forEach((t, i) => {
        const avg = t.avg_total_seconds;
        const pct = avg ? Math.round((avg / maxAvg) * 100) : 0;
        const color = teamColors[i % teamColors.length];
        html +=
          '<div class="evt-row">' +
            '<div class="evt-name">' + t.evt_name + '</div>' +
            '<div class="evt-time">' + (avg ? formatDuration(avg) : '-') + '</div>' +
            '<div class="evt-bar-bg">' +
              '<div class="evt-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div>' +
            '</div>' +
          '</div>';
      });
      html += '</div>';

      // Per-case cross-team comparison
      // Group cases by case_id across teams
      const caseMap = {};
      teams.forEach(t => {
        (t.cases || []).forEach(c => {
          if (!caseMap[c.case_id]) caseMap[c.case_id] = { schlagwort: c.schlagwort, teams: {} };
          if (c.total_seconds !== null && c.total_seconds !== undefined) {
            caseMap[c.case_id].teams[t.evt_name] = c.total_seconds;
          }
        });
      });

      // Only show cases handled by multiple teams
      const multiTeamCases = Object.entries(caseMap).filter(([_, v]) => Object.keys(v.teams).length > 1);
      if (multiTeamCases.length > 0) {
        html += '<div style="margin-top:1.5rem;">';
        multiTeamCases.forEach(([caseId, info]) => {
          const caseMax = Math.max(...Object.values(info.teams), 1);
          html += '<div class="evt-comparison" style="margin-bottom:1rem;">' +
            '<h4 style="font-size:.85rem;margin-bottom:.8rem;color:var(--accent);">Fall ' + caseId + ' &ndash; ' + info.schlagwort + '</h4>';
          Object.entries(info.teams).forEach(([evtName, seconds]) => {
            const pct = Math.round((seconds / caseMax) * 100);
            const teamIdx = teams.findIndex(t => t.evt_name === evtName);
            const color = teamColors[(teamIdx >= 0 ? teamIdx : 0) % teamColors.length];
            html +=
              '<div class="evt-row">' +
                '<div class="evt-name">' + evtName + '</div>' +
                '<div class="evt-time">' + formatDuration(seconds) + '</div>' +
                '<div class="evt-bar-bg">' +
                  '<div class="evt-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div>' +
                '</div>' +
              '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
      }

      document.getElementById('evtComparison').innerHTML = html;
      document.getElementById('evtComparisonSection').style.display = 'block';
    }

    // Start
    loadAuswertung();
  </script>
</body>
</html>
