services:
  opman:
    build: .
    image: opman-gpt:latest
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8000}:8000"

    environment:
      # Pflicht: starkes zufälliges Secret setzen (z.B. openssl rand -hex 32)
      SECRET_KEY: "${SECRET_KEY}"

      # Anzahl gunicorn-Worker (Faustregel: 2 × CPU-Kerne + 1)
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"

      # Öffentliche Base-URL (für QR-Codes, EVT-Links etc.)
      # Leer = automatische LAN-IP-Erkennung
      # Beispiel: https://uebung.feuerwehr-musterstadt.de
      BASE_URL: "${BASE_URL:-}"

      # GitHub-Zugang für Updates aus dem privaten Repo
      GITHUB_USER: "${GITHUB_USER:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"

    volumes:
      # Gesamtes Repo mounten → git pull im Container aktualisiert den Code
      # persistent auf dem Host-Dateisystem (überlebt Container-Neustarts).
      # :Z → SELinux-Label für private (nicht geteilte) Volumes (rootless-kompatibel).
      - .:/app:Z
      # instance/ separat sicherstellen (Datenbank, Zertifikate, VAPID-Keys)
      - ./instance:/app/instance:Z

    security_opt:
      # Verhindert Privilege-Escalation im Container
      - no-new-privileges:true

    # Kein root, kein privileged – rootless-Docker-kompatibel
    # user: "1000:1000"  # bereits im Dockerfile gesetzt, hier optional

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
