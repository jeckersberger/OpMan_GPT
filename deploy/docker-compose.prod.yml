# =============================================================================
# OpMan-GPT Production Docker Compose
# =============================================================================
# High-availability deployment with:
#   - PostgreSQL 16 with replication-ready configuration
#   - Redis for session storage and rate limiting
#   - nginx reverse proxy / load balancer
#   - Multiple application instances (2 replicas)
#   - Health checks on all services
#   - Resource limits and restart policies
#   - Persistent volume mounts
#
# Usage:
#   1. Copy .env.example to .env and configure all variables
#   2. Generate SSL certificates and place in ./ssl/
#   3. Generate DH params: openssl dhparam -out ./ssl/dhparam.pem 4096
#   4. Start: docker compose -f deploy/docker-compose.prod.yml up -d
#   5. Monitor: docker compose -f deploy/docker-compose.prod.yml logs -f
#
# Required .env variables:
#   SECRET_KEY, DB_PASSWORD, BACKUP_ENCRYPTION_KEY, REDIS_PASSWORD
# =============================================================================

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: "${DB_NAME:-opman}"
      POSTGRES_USER: "${DB_USER:-opman}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      # Replication-ready settings
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"  # Only expose to localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opman} -d ${DB_NAME:-opman}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=200
        -c wal_level=replica
        -c max_wal_senders=3
        -c max_replication_slots=3
        -c hot_standby=on
        -c logging_collector=on
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_connections=on
        -c log_disconnections=on
        -c ssl=off
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Only expose to localhost
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # ── OpMan-GPT Application Instance 1 ──────────────────────────────────────
  opman-app-1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opman-gpt:latest
    restart: always
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      # Database
      DB_TYPE: "postgresql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-opman}"
      DB_USER: "${DB_USER:-opman}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSL_MODE: "disable"  # Within Docker network, TLS not needed
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      # Redis
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # Monitoring
      ENABLE_METRICS: "true"
    volumes:
      - app_instance:/app/instance:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # ── OpMan-GPT Application Instance 2 (replica) ────────────────────────────
  opman-app-2:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opman-gpt:latest
    restart: always
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      DB_TYPE: "postgresql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-opman}"
      DB_USER: "${DB_USER:-opman}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSL_MODE: "disable"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      ENABLE_METRICS: "true"
    volumes:
      - app_instance:/app/instance:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # ── nginx Load Balancer / Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      opman-app-1:
        condition: service_healthy
      opman-app-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_instance:
    driver: local
  nginx_logs:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
